<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - GreenFood</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-top">
            <div class="logo">
                <a href="index.html">Green<span>Food</span></a>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm món ăn, nước uống...">
                <button type="button">Tìm kiếm</button>
            </div>
            <div class="header-user-actions">
                <a href="register.html" class="action-item">👤 Đăng nhập / Đăng ký</a>
                <a href="cart.html" class="action-item cart-btn">🛒 Giỏ hàng <span class="cart-count">0</span></a>
            </div>
        </div>

        <div class="navigation-bar">
            <div class="container nav-container">
                
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html" class="active">TRANG CHỦ</a></li>
                        <li><a href="order.html">ORDER</a></li>
                        <li><a href="blog.html">BLOG</a></li> <li><a href="about.html">VỀ CHÚNG TÔI</a></li>
                        <li><a href="labs.html">LAB THỰC HÀNH</a></li>
                        
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main class="auth-container">
        <h2>ĐĂNG NHẬP</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Mật khẩu" required>
            </div>
            <div class="auth-links">
                <a href="#">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>
        <p class="auth-links">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </main>

</body>
</html>
